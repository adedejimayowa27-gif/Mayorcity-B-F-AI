<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try{
    var saved = localStorage.getItem('mb_theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121114">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<title>You're offline — Mayorcity B&amp;F AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .status-page{
    margin:auto; text-align:center; max-width:460px; padding:24px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .status-page .glyph{
    width:52px; height:52px; border-radius:50%;
    border:1px solid var(--line-gold); display:flex; align-items:center; justify-content:center;
    color:var(--gold-bright);
  }
  .status-page h1{ font-family:var(--display); font-style:italic; font-weight:500; font-size:24px; margin:0; color:var(--text); }
  .status-page p{ color:var(--text-soft); font-size:14.5px; line-height:1.6; margin:0; }
  .status-page button{
    margin-top:8px; font-family:var(--sans); font-weight:600; font-size:13px;
    padding:10px 22px; border-radius:999px; border:none; cursor:pointer;
    background: linear-gradient(155deg, var(--gold-bright), var(--gold)); color:#1A1408;
  }
</style>
</head>
<body>
<main style="display:flex; flex:1;">
  <div class="status-page">
    <div class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9a16 16 0 0 1 22 0M5 13a10 10 0 0 1 14 0M8.5 17a5 5 0 0 1 7 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Mayorcity B&amp;F AI needs a connection to reach the study assistant. Your previous conversation is safe — reconnect and it'll be right where you left it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
