<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try{
    var saved = localStorage.getItem('mb_theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<script>
/* Fast pre-paint auth check, same as index.html: if there's no local Supabase session
   token at all, bounce to the welcome page immediately. The authoritative admin check
   (requireAdminPage) runs once auth.js loads. */
(function(){
  try{
    var hasSession = Object.keys(localStorage).some(function(k){
      return k.indexOf('-auth-token') !== -1 && localStorage.getItem(k);
    });
    if(!hasSession){ window.location.replace('welcome.html'); }
  }catch(e){ /* localStorage unavailable — let auth.js's async check handle it */ }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121114">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Admin — Mayorcity B&amp;F AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-body">

<header class="auth-header">
  <a class="brand" href="index.html" style="text-decoration:none;">
    <svg class="mark-svg" viewBox="0 0 44 44" role="img" aria-label="Mayorcity B&amp;F AI logo">
      <circle cx="22" cy="22" r="20" fill="rgba(255,255,255,0.03)" stroke="#C9A66B" stroke-width="1"/>
      <text x="22" y="29" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="17" fill="#E4C68C" text-anchor="middle">MB</text>
    </svg>
    <h1>Admin</h1>
  </a>
  <div style="display:flex; align-items:center; gap:10px;">
    <a href="index.html" class="btn btn-secondary" style="padding:9px 16px; font-size:13px;">&larr; Back to chat</a>
    <button id="themeToggleBtn" class="icon-btn theme-toggle-btn" type="button" aria-label="Switch to light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>
</header>

<main class="admin-main">

  <section id="usersSection">
    <div class="admin-section-head">
      <div>
        <h2>Users</h2>
        <p class="admin-section-sub">Sorted by messages sent — your most active students first.</p>
      </div>
    </div>
    <div class="tab-row" id="tabRow">
      <button class="tab-btn active" data-filter="all" type="button">All <span class="count" id="countAll"></span></button>
      <button class="tab-btn" data-filter="pending" type="button">Pending <span class="count" id="countPending"></span></button>
      <button class="tab-btn" data-filter="approved" type="button">Approved <span class="count" id="countApproved"></span></button>
      <button class="tab-btn" data-filter="rejected" type="button">Rejected <span class="count" id="countRejected"></span></button>
    </div>
    <div id="usersList"><p class="admin-loading">Loading users&hellip;</p></div>
  </section>

  <section id="kbSection">
    <div class="admin-section-head">
      <div>
        <h2>Knowledge base</h2>
        <p class="admin-section-sub">Upload material to add to what the AI can reference, alongside the built-in study packs.</p>
      </div>
    </div>

    <form class="upload-card" id="uploadForm" novalidate>
      <div class="form-error" id="uploadError"></div>
      <div class="field-row">
        <div class="field">
          <label for="docTitle">Title</label>
          <input type="text" id="docTitle" placeholder="e.g. Insurance Study Pack 2026" required>
        </div>
        <div class="field">
          <label for="docSubject">Subject</label>
          <input type="text" id="docSubject" placeholder="e.g. Insurance">
        </div>
      </div>
      <div class="field">
        <label for="docFile">Upload a .txt or .md file (optional)</label>
        <label class="file-drop" for="docFile">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          <span id="fileDropLabel">Choose a file, or paste text below</span>
          <input type="file" id="docFile" accept=".txt,.md,text/plain,text/markdown">
        </label>
      </div>
      <div class="field">
        <label for="docText">Document text</label>
        <textarea id="docText" placeholder="Paste the document's text here, or choose a file above to fill this in automatically."></textarea>
        <p class="hint" id="docTextHint">&nbsp;</p>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="uploadBtn">Upload to knowledge base</button>
    </form>

    <div id="docsList"><p class="admin-loading">Loading documents&hellip;</p></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/admin.js" defer></script>
</body>
</html>
